<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ophelia's Tears - Tattoo & Art Studio</title>
  <link rel="icon" type="image/png" href="favicon-2.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="container">
    <div class="header">
      <img class="header-left" src="header-logo.png" alt="Ophelia's Tears Studio">
      <nav class="header-nav">
        <a class="nav-link" href="#about">About</a>
        <a class="nav-link" href="#artists">Artists</a>
        <a class="nav-link nav-link-external" href="https://venue.ink/@snakeroots.00/flash" target="_blank">Browse Flash <img class="nav-arrow" src="arrow-icon.svg" alt=""></a>
        <a class="nav-link nav-link-external" href="https://venue.ink/@snakeroots.00/page/info" target="_blank">Booking Info <img class="nav-arrow" src="arrow-icon.svg" alt=""></a>
        <a class="nav-link nav-link-external" href="https://venue.ink/@snakeroots.00/page/aftercare" target="_blank">Aftercare <img class="nav-arrow" src="arrow-icon.svg" alt=""></a>
      </nav>
      <a class="header-right" href="https://venue.ink/@snakeroots.00" target="_blank">Booking Form <img class="button-arrow" src="arrow-icon-white.svg" alt=""></a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
      <div class="mobile-menu-header">
        <img class="header-left" src="header-logo.png" alt="Ophelia's Tears Studio">
        <button class="menu-toggle active" id="menuClose" aria-label="Close menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
      <div class="mobile-menu-content">
        <a href="#about">About</a>
        <a href="#artists">Artists</a>
        <a href="https://venue.ink/@snakeroots.00/flash" target="_blank">Browse Flash <img src="arrow-icon.svg" alt=""></a>
        <a href="https://venue.ink/@snakeroots.00/page/info" target="_blank">Booking Info <img src="arrow-icon.svg" alt=""></a>
        <div class="aftercare-wrapper">
          <a href="https://venue.ink/@snakeroots.00/page/aftercare" target="_blank">Aftercare <img src="arrow-icon.svg" alt=""></a>
          <img src="flower-icon-menu.svg" alt="" class="aftercare-icon">
        </div>
      </div>
      <div class="mobile-menu-cta">
        <a class="header-right" href="https://venue.ink/@snakeroots.00" target="_blank">Booking Form <img class="button-arrow" src="arrow-icon-white.svg" alt=""></a>
      </div>
    </div>

    <div class="studio-name" id="studio-name-container">
      <img class="studio-name-img desktop" src="studio-name-art.png" alt="Ophelia's Tear">
      <img class="studio-name-img mobile" src="studio-name-art-mobile.svg" alt="Ophelia's Tear">
    </div>

    <div class="hero-image">
      <img src="hero-img-01.png" alt="Ophelia's Tears artwork">
    </div>

    <!-- Mobile Footer Container (appears on homepage) -->
    <div class="footer-container">
      <div class="footer">
        <img class="footer-icon" src="flower-icon.svg" alt="">
        <p class="footer-address">12 PARK ST, BROOKLYN, NY</p>
        <p class="footer-address">BY APPOINTMENT ONLY</p>
        <p class="footer-copyright">©2026 OPHELIA'S TEARS STUDIO</p>
      </div>
    </div>

    <!-- Mobile Booking Button (White Container) -->
    <div class="mobile-cta-container">
      <a class="header-right" href="https://venue.ink/@snakeroots.00" target="_blank">Booking Form <img class="button-arrow" src="arrow-icon-white.svg" alt=""></a>
    </div>
  </div>

  <!-- Mobile Design grid overlay (375px) -->
  <svg class="grid-overlay mobile-grid" viewBox="0 0 375 812" preserveAspectRatio="none">
    <defs>
      <style>
        .grid-column { fill: rgba(100, 150, 200, 0.08); }
        .grid-line { stroke: rgba(100, 150, 200, 0.3); stroke-width: 1; }
        .grid-label { font-family: 'Courier New', monospace; font-size: 8px; fill: rgba(100, 150, 200, 0.5); }
      </style>
    </defs>

    <!-- Margin guides -->
    <line class="grid-line" x1="31" y1="0" x2="31" y2="812" />
    <line class="grid-line" x1="344" y1="0" x2="344" y2="812" />

    <!-- Column backgrounds -->
    <g class="grid-columns">
      <rect class="grid-column" x="31" y="0" width="156.5" height="812" />
      <rect class="grid-column" x="187.5" y="0" width="156.5" height="812" />
    </g>

    <!-- Vertical grid lines -->
    <g class="grid-lines">
      <line class="grid-line" x1="187.5" y1="0" x2="187.5" y2="812" />
    </g>

    <!-- Column labels -->
    <g class="grid-labels">
      <text class="grid-label" x="35" y="12">Col 1</text>
      <text class="grid-label" x="191.5" y="12">Col 2</text>
    </g>
  </svg>

  <!-- Design grid overlay (Desktop) -->
  <svg class="grid-overlay desktop-grid" viewBox="0 0 1440 976" preserveAspectRatio="none">
    <defs>
      <style>
        .grid-column { fill: rgba(100, 150, 200, 0.08); }
        .grid-line { stroke: rgba(100, 150, 200, 0.3); stroke-width: 1; }
        .grid-label { font-family: 'Courier New', monospace; font-size: 10px; fill: rgba(100, 150, 200, 0.5); }
      </style>
    </defs>

    <!-- Column backgrounds -->
    <g class="grid-columns">
      <rect class="grid-column" x="60" y="0" width="153.33" height="976" />
      <rect class="grid-column" x="293.33" y="0" width="153.33" height="976" />
      <rect class="grid-column" x="526.67" y="0" width="153.33" height="976" />
      <rect class="grid-column" x="760" y="0" width="153.33" height="976" />
      <rect class="grid-column" x="993.33" y="0" width="153.33" height="976" />
      <rect class="grid-column" x="1226.67" y="0" width="153.33" height="976" />
    </g>

    <!-- Vertical grid lines -->
    <g class="grid-lines">
      <line class="grid-line" x1="60" y1="0" x2="60" y2="976" />
      <line class="grid-line" x1="213.33" y1="0" x2="213.33" y2="976" />
      <line class="grid-line" x1="293.33" y1="0" x2="293.33" y2="976" />
      <line class="grid-line" x1="446.67" y1="0" x2="446.67" y2="976" />
      <line class="grid-line" x1="526.67" y1="0" x2="526.67" y2="976" />
      <line class="grid-line" x1="680" y1="0" x2="680" y2="976" />
      <line class="grid-line" x1="760" y1="0" x2="760" y2="976" />
      <line class="grid-line" x1="913.33" y1="0" x2="913.33" y2="976" />
      <line class="grid-line" x1="993.33" y1="0" x2="993.33" y2="976" />
      <line class="grid-line" x1="1146.67" y1="0" x2="1146.67" y2="976" />
      <line class="grid-line" x1="1226.67" y1="0" x2="1226.67" y2="976" />
      <line class="grid-line" x1="1380" y1="0" x2="1380" y2="976" />
    </g>

    <!-- Column labels -->
    <g class="grid-labels">
      <text class="grid-label" x="66" y="15">Col 1</text>
      <text class="grid-label" x="299.33" y="15">Col 2</text>
      <text class="grid-label" x="532.67" y="15">Col 3</text>
      <text class="grid-label" x="766" y="15">Col 4</text>
      <text class="grid-label" x="999.33" y="15">Col 5</text>
      <text class="grid-label" x="1232.67" y="15">Col 6</text>
    </g>
  </svg>

  <script src="script.js"></script>
</body>
</html>
