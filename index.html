<!DOCTYPE html>

<body>

      <img class="header-left" src="header-logo.png" alt="Ophelia's Tears Studio">

      <a class="header-right" href="https://venue.ink/@snakeroots.00" target="_blank">Book Now <img class="button-arrow" src="arrow-icon-white.svg" alt=""></a>

        <span></span>
        <span></span>
        <span></span>

        <button class="menu-toggle active" id="menuClose" aria-label="Close menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
      <div class="mobile-menu-content">
        <a href="#about">About</a>
        <a href="#artists">Artists</a>
        <a href="https://venue.ink/@snakeroots.00/flash" target="_blank">Browse Flash <img src="arrow-icon.svg" alt=""></a>

        <a href="https://venue.ink/@snakeroots.00/page/aftercare" target="_blank">Aftercare <img src="arrow-icon.svg" alt=""></a>
        <img src="flower-icon-menu.svg" alt="" class="menu-flower-icon">
      </div>
      <div class="mobile-menu-cta">
        <a class="header-right" href="https://venue.ink/@snakeroots.00" target="_blank">Book Now <img class="button-arrow" src="arrow-icon-white.svg" alt=""></a>

    </div>

    <div class="studio-name" id="studio-name-container">

    </div>

    <!-- Mobile Footer (appears on homepage) -->
    <div class="footer">

      <p class="footer-address">12 PARK ST, BROOKLYN, NY</p>
      <p class="footer-address">BY APPOINTMENT ONLY</p>
      <p class="footer-copyright">©2026 OPHELIA'S TEARS STUDIO</p>
    </div>

    <!-- Mobile Booking Button (White Container) -->
    <div class="mobile-cta-container">

  <!-- S Breakpoint Grid (375px) - 4 columns, 24px margins, 20px gutters -->

    <defs>
      <style>
        .grid-column { fill: rgba(100, 150, 200, 0.08); }
        .grid-line { stroke: rgba(100, 150, 200, 0.3); stroke-width: 1; }
        .grid-label { font-family: 'Courier New', monospace; font-size: 8px; fill: rgba(100, 150, 200, 0.5); }
      </style>
    </defs>

    <!-- Margin guides -->
    <line class="grid-line" x1="24" y1="0" x2="24" y2="812" />
    <line class="grid-line" x1="351" y1="0" x2="351" y2="812" />

    <!-- Column backgrounds (4 columns: 66.75px each, 20px gutters) -->
    <g class="grid-columns">
      <rect class="grid-column" x="24" y="0" width="66.75" height="812" />
      <rect class="grid-column" x="110.75" y="0" width="66.75" height="812" />
      <rect class="grid-column" x="197.5" y="0" width="66.75" height="812" />
      <rect class="grid-column" x="284.25" y="0" width="66.75" height="812" />
    </g>

    <!-- Vertical grid lines -->
    <g class="grid-lines">
      <line class="grid-line" x1="24" y1="0" x2="24" y2="812" />
      <line class="grid-line" x1="110.75" y1="0" x2="110.75" y2="812" />
      <line class="grid-line" x1="197.5" y1="0" x2="197.5" y2="812" />
      <line class="grid-line" x1="284.25" y1="0" x2="284.25" y2="812" />
      <line class="grid-line" x1="351" y1="0" x2="351" y2="812" />
    </g>

    <!-- Column labels -->
    <g class="grid-labels">
      <text class="grid-label" x="28" y="12">1</text>
      <text class="grid-label" x="114.75" y="12">2</text>
      <text class="grid-label" x="201.5" y="12">3</text>
      <text class="grid-label" x="288.25" y="12">4</text>
