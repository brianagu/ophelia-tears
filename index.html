<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#d5f1ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Ophelia's Tears Studio – Tattoo & Art Studio</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <!-- Desktop logo (L breakpoint only) -->
      <img class="header-logo" src="desktop-logo.svg" alt="Ophelia's Tears Studio">

      <!-- Desktop navigation (L breakpoint only) -->
      <nav class="header-nav">
        <a class="nav-link" href="#about">About</a>
        <a class="nav-link" href="#artists">Artists</a>
        <a class="nav-link" href="https://venue.ink/@snakeroots.00/flash" target="_blank">Browse Flash <img class="nav-arrow" src="arrow-icon.svg" alt=""></a>
        <a class="nav-link" href="https://venue.ink/@snakeroots.00/page/info" target="_blank">Booking Info <img class="nav-arrow" src="arrow-icon.svg" alt=""></a>
        <a class="nav-link" href="https://venue.ink/@snakeroots.00/page/aftercare" target="_blank">Aftercare <img class="nav-arrow" src="arrow-icon.svg" alt=""></a>
      </nav>

      <!-- Book Now CTA (all breakpoints) -->
      <a class="header-cta" href="https://venue.ink/@snakeroots.00" target="_blank">Book Now <img class="cta-arrow" src="arrow-icon-white.svg" alt=""></a>

      <!-- Menu toggle (S/M breakpoints) -->
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <!-- Mobile Menu Overlay -->
    <div class="mobile-menu" id="mobileMenu">
      <!-- Menu header: close icon + Book CTA -->
      <div class="mobile-menu-header">
        <button class="close-icon" id="menuClose" aria-label="Close menu">
          <span class="close-line close-line-1"></span>
          <span class="close-line close-line-2"></span>
        </button>
        <a class="header-cta menu-cta" href="https://venue.ink/@snakeroots.00" target="_blank">Book Now <img class="cta-arrow" src="arrow-icon-white.svg" alt=""></a>
      </div>

      <!-- Navigation links -->
      <div class="mobile-menu-content">
        <a class="menu-link" href="#about">About</a>
        <a class="menu-link" href="#artists">Artists</a>
        <a class="menu-link" href="https://venue.ink/@snakeroots.00/flash" target="_blank">Browse Flash <img class="nav-arrow" src="arrow-icon.svg" alt=""></a>
        <a class="menu-link" href="https://venue.ink/@snakeroots.00/page/info" target="_blank">Booking Info <img class="nav-arrow" src="arrow-icon.svg" alt=""></a>
        <a class="menu-link" href="https://venue.ink/@snakeroots.00/page/aftercare" target="_blank">Aftercare</a>
      </div>

      <!-- Menu footer -->
      <div class="mobile-menu-footer">
        <img class="footer-logo-menu" src="mobile-logo.svg" alt="Ophelia's Tears Studio">
        <p class="menu-footer-text">12 PARK ST, BROOKLYN, NY</p>
        <p class="menu-footer-text">BY APPOINTMENT ONLY</p>
        <img class="footer-icon-menu" src="flower-icon.svg" alt="">
        <p class="menu-footer-text">©2026 OPHELIA'S TEARS STUDIO</p>
      </div>
    </div>

    <!-- Studio name / ripple container -->
    <div class="studio-name" id="studio-name-container">
      <img class="studio-name-img desktop" src="studio-name-art.png" alt="Ophelia's Tear">
      <img class="studio-name-img mobile" src="studio-name-art-mobile.png" alt="Ophelia's Tear">
    </div>

    <!-- Background illustration -->
    <div class="desktop-bg"></div>

    <!-- Hero image -->
    <div class="hero-image">
      <img src="hero-img-01.png" alt="Ophelia's Tears artwork">
    </div>

    <!-- Homepage footer -->
    <div class="footer">
      <!-- Logo (S/M breakpoints) -->
      <img class="footer-logo" src="mobile-logo.svg" alt="Ophelia's Tears Studio">

      <!-- Address -->
      <p class="footer-text">12 PARK ST, BROOKLYN, NY</p>

      <!-- Appointment -->
      <p class="footer-text">BY APPOINTMENT ONLY</p>

      <!-- Flower icon -->
      <img class="footer-icon" src="flower-icon.svg" alt="">

      <!-- Copyright -->
      <p class="footer-text footer-copyright">©2026 OPHELIA'S TEARS STUDIO</p>
    </div>

    <!-- Mobile CTA (bottom button, S/M only) -->
    <div class="mobile-cta">
      <a class="header-cta" href="https://venue.ink/@snakeroots.00" target="_blank">Book Now <img class="cta-arrow" src="arrow-icon-white.svg" alt=""></a>
    </div>
  </div>

  <!-- S Breakpoint grid overlay (375px, 4-column) -->
  <svg class="grid-overlay s-grid" viewBox="0 0 375 1000" preserveAspectRatio="none">
    <defs>
      <style>
        .grid-column { fill: rgba(100, 150, 200, 0.08); }
        .grid-line { stroke: rgba(100, 150, 200, 0.3); stroke-width: 1; }
        .grid-label { font-family: 'Courier New', monospace; font-size: 8px; fill: rgba(100, 150, 200, 0.5); }
      </style>
    </defs>

    <!-- Margin guides -->
    <line class="grid-line" x1="24" y1="0" x2="24" y2="1000" />
    <line class="grid-line" x1="351" y1="0" x2="351" y2="1000" />

    <!-- Column backgrounds (4 columns: 66.75px each, 20px gutters) -->
    <g class="grid-columns">
      <rect class="grid-column" x="24" y="0" width="66.75" height="1000" />
      <rect class="grid-column" x="110.75" y="0" width="66.75" height="1000" />
      <rect class="grid-column" x="197.5" y="0" width="66.75" height="1000" />
      <rect class="grid-column" x="284.25" y="0" width="66.75" height="1000" />
    </g>

    <!-- Vertical grid lines -->
    <g class="grid-lines">
      <line class="grid-line" x1="24" y1="0" x2="24" y2="1000" />
      <line class="grid-line" x1="110.75" y1="0" x2="110.75" y2="1000" />
      <line class="grid-line" x1="197.5" y1="0" x2="197.5" y2="1000" />
      <line class="grid-line" x1="284.25" y1="0" x2="284.25" y2="1000" />
      <line class="grid-line" x1="351" y1="0" x2="351" y2="1000" />
    </g>

    <!-- Column labels -->
    <g class="grid-labels">
      <text class="grid-label" x="28" y="12">1</text>
      <text class="grid-label" x="114.75" y="12">2</text>
      <text class="grid-label" x="201.5" y="12">3</text>
      <text class="grid-label" x="288.25" y="12">4</text>
    </g>
  </svg>

  <!-- M Breakpoint grid overlay (720px, 8-column) -->
  <svg class="grid-overlay m-grid" viewBox="0 0 720 1000" preserveAspectRatio="none">
    <defs>
      <style>
        .grid-column { fill: rgba(100, 150, 200, 0.08); }
        .grid-line { stroke: rgba(100, 150, 200, 0.3); stroke-width: 1; }
        .grid-label { font-family: 'Courier New', monospace; font-size: 8px; fill: rgba(100, 150, 200, 0.5); }
      </style>
    </defs>

    <!-- Margin guides -->
    <line class="grid-line" x1="32" y1="0" x2="32" y2="1000" />
    <line class="grid-line" x1="688" y1="0" x2="688" y2="1000" />

    <!-- Column backgrounds (8 columns: 64.5px each, 20px gutters) -->
    <g class="grid-columns">
      <rect class="grid-column" x="32" y="0" width="64.5" height="1000" />
      <rect class="grid-column" x="116.5" y="0" width="64.5" height="1000" />
      <rect class="grid-column" x="201" y="0" width="64.5" height="1000" />
      <rect class="grid-column" x="285.5" y="0" width="64.5" height="1000" />
      <rect class="grid-column" x="370" y="0" width="64.5" height="1000" />
      <rect class="grid-column" x="454.5" y="0" width="64.5" height="1000" />
      <rect class="grid-column" x="539" y="0" width="64.5" height="1000" />
      <rect class="grid-column" x="623.5" y="0" width="64.5" height="1000" />
    </g>

    <!-- Vertical grid lines -->
    <g class="grid-lines">
      <line class="grid-line" x1="32" y1="0" x2="32" y2="1000" />
      <line class="grid-line" x1="116.5" y1="0" x2="116.5" y2="1000" />
      <line class="grid-line" x1="201" y1="0" x2="201" y2="1000" />
      <line class="grid-line" x1="285.5" y1="0" x2="285.5" y2="1000" />
      <line class="grid-line" x1="370" y1="0" x2="370" y2="1000" />
      <line class="grid-line" x1="454.5" y1="0" x2="454.5" y2="1000" />
      <line class="grid-line" x1="539" y1="0" x2="539" y2="1000" />
      <line class="grid-line" x1="623.5" y1="0" x2="623.5" y2="1000" />
      <line class="grid-line" x1="688" y1="0" x2="688" y2="1000" />
    </g>

    <!-- Column labels -->
    <g class="grid-labels">
      <text class="grid-label" x="36" y="12">1</text>
      <text class="grid-label" x="120.5" y="12">2</text>
      <text class="grid-label" x="205" y="12">3</text>
      <text class="grid-label" x="289.5" y="12">4</text>
      <text class="grid-label" x="374" y="12">5</text>
      <text class="grid-label" x="458.5" y="12">6</text>
      <text class="grid-label" x="543" y="12">7</text>
      <text class="grid-label" x="627.5" y="12">8</text>
    </g>
  </svg>

  <!-- L Breakpoint grid overlay (1440px, 12-column) -->
  <svg class="grid-overlay l-grid" viewBox="0 0 1440 1000" preserveAspectRatio="none">
    <defs>
      <style>
        .grid-column { fill: rgba(100, 150, 200, 0.08); }
        .grid-line { stroke: rgba(100, 150, 200, 0.3); stroke-width: 1; }
        .grid-label { font-family: 'Courier New', monospace; font-size: 9px; fill: rgba(100, 150, 200, 0.5); }
      </style>
    </defs>

    <!-- Margin guides -->
    <line class="grid-line" x1="40" y1="0" x2="40" y2="1000" />
    <line class="grid-line" x1="1400" y1="0" x2="1400" y2="1000" />

    <!-- Column backgrounds (12 columns: 84px each, 32px gutters) -->
    <g class="grid-columns">
      <rect class="grid-column" x="40" y="0" width="84" height="1000" />
      <rect class="grid-column" x="156" y="0" width="84" height="1000" />
      <rect class="grid-column" x="272" y="0" width="84" height="1000" />
      <rect class="grid-column" x="388" y="0" width="84" height="1000" />

      <rect class="grid-column" x="736" y="0" width="84" height="1000" />
      <rect class="grid-column" x="852" y="0" width="84" height="1000" />
      <rect class="grid-column" x="968" y="0" width="84" height="1000" />

      <rect class="grid-column" x="1316" y="0" width="84" height="1000" />
    </g>

    <!-- Vertical grid lines -->
    <g class="grid-lines">
      <line class="grid-line" x1="40" y1="0" x2="40" y2="1000" />
      <line class="grid-line" x1="156" y1="0" x2="156" y2="1000" />
      <line class="grid-line" x1="272" y1="0" x2="272" y2="1000" />
      <line class="grid-line" x1="388" y1="0" x2="388" y2="1000" />
      <line class="grid-line" x1="504" y1="0" x2="504" y2="1000" />
      <line class="grid-line" x1="620" y1="0" x2="620" y2="1000" />
      <line class="grid-line" x1="736" y1="0" x2="736" y2="1000" />
      <line class="grid-line" x1="852" y1="0" x2="852" y2="1000" />
      <line class="grid-line" x1="968" y1="0" x2="968" y2="1000" />
      <line class="grid-line" x1="1084" y1="0" x2="1084" y2="1000" />
      <line class="grid-line" x1="1200" y1="0" x2="1200" y2="1000" />
      <line class="grid-line" x1="1316" y1="0" x2="1316" y2="1000" />
      <line class="grid-line" x1="1400" y1="0" x2="1400" y2="1000" />
    </g>

    <!-- Column labels -->
    <g class="grid-labels">
      <text class="grid-label" x="44" y="15">1</text>
      <text class="grid-label" x="160" y="15">2</text>
      <text class="grid-label" x="276" y="15">3</text>
      <text class="grid-label" x="392" y="15">4</text>
      <text class="grid-label" x="508" y="15">5</text>
      <text class="grid-label" x="624" y="15">6</text>
      <text class="grid-label" x="740" y="15">7</text>
      <text class="grid-label" x="856" y="15">8</text>
      <text class="grid-label" x="972" y="15">9</text>
      <text class="grid-label" x="1088" y="15">10</text>
      <text class="grid-label" x="1204" y="15">11</text>
      <text class="grid-label" x="1320" y="15">12</text>
    </g>
  </svg>

  <script src="script.js"></script>
</body>
</html>
